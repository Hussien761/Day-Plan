<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Hour Planner</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#22201B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F5EF; --paper-2:#FFFFFF; --ink:#22201B; --ink-soft:#5B584E; --ink-mute:#9B9587;
    --line:#E3DFD2; --line-soft:#EDEADE; --blue:#2F5C8A; --blue-soft:#E8EFF6;
    --amber:#C97A2E; --amber-soft:#FBEDDC; --green:#3B6D11; --green-soft:#EAF3DE; --radius:10px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:920px;margin:0 auto;padding:24px 20px 80px;}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap;}
  .title{font-family:'Fraunces',serif;font-weight:600;font-size:26px;letter-spacing:-0.01em;margin:0;}
  .sub{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-mute);margin-top:4px;letter-spacing:0.02em;}
  .tabs{display:flex;background:var(--paper-2);border:1px solid var(--line);border-radius:999px;padding:3px;}
  .tab{border:none;background:transparent;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;padding:7px 16px;border-radius:999px;cursor:pointer;color:var(--ink-soft);}
  .tab.active{background:var(--ink);color:var(--paper-2);}
  .nav{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .nav button{border:1px solid var(--line);background:var(--paper-2);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:15px;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;}
  .nav button:hover{border-color:var(--ink-mute);color:var(--ink);}
  .nav .label{font-family:'Fraunces',serif;font-size:17px;font-weight:600;min-width:190px;}
  .nav .today-btn{width:auto;padding:0 12px;font-family:'Inter',sans-serif;font-size:12px;font-weight:500;color:var(--ink-soft);}

  .day-grid{position:relative;background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .hour-row{display:grid;grid-template-columns:64px 36px 1fr;border-bottom:1px solid var(--line-soft);position:relative;align-items:stretch;}
  .hour-row:last-child{border-bottom:none;}
  .hour-tick{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-mute);padding:10px 10px 0 0;text-align:right;position:relative;border-right:1px solid var(--line);}
  .hour-tick::after{content:"";position:absolute;right:-1px;top:14px;width:6px;height:1px;background:var(--ink-mute);}
  .check-cell{display:flex;align-items:flex-start;justify-content:center;padding-top:12px;border-right:1px solid var(--line-soft);}
  .check-cell input[type=checkbox]{width:17px;height:17px;accent-color:var(--green);cursor:pointer;}
  .hour-task textarea{width:100%;min-height:44px;border:none;background:transparent;resize:none;font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);padding:10px 14px;line-height:1.4;outline:none;}
  .hour-task textarea::placeholder{color:var(--ink-mute);}
  .hour-task textarea:focus{background:var(--blue-soft);}
  .hour-row.done .hour-task textarea{color:var(--ink-mute);text-decoration:line-through;text-decoration-color:var(--ink-mute);}
  .hour-row.done{background:var(--green-soft);}
  .now-line{position:absolute;left:100px;right:0;height:2px;background:var(--amber);z-index:2;pointer-events:none;}
  .now-line::before{content:"now";position:absolute;left:-2px;top:-8px;transform:translateX(-100%);font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--amber);background:var(--amber-soft);padding:1px 5px;border-radius:4px;white-space:nowrap;}
  .hour-row.current-hour{background:var(--amber-soft);}
  .hour-row.current-hour.done{background:var(--green-soft);}

  .week-grid{background:var(--paper-2);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;overflow-x:auto;}
  table.week{border-collapse:collapse;width:100%;min-width:820px;}
  table.week th{font-family:'Fraunces',serif;font-weight:600;font-size:13px;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line-soft);background:var(--paper);}
  table.week th .dnum{display:block;font-family:'JetBrains Mono',monospace;font-weight:400;font-size:11px;color:var(--ink-mute);margin-top:2px;}
  table.week th.today-col{color:var(--blue);}
  table.week td{border-bottom:1px solid var(--line-soft);border-right:1px solid var(--line-soft);vertical-align:top;padding:0;}
  table.week td:last-child, table.week th:last-child{border-right:none;}
  .wk-hour{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-mute);padding:6px 8px 0;background:var(--paper);white-space:nowrap;}
  .wk-cell{display:flex;align-items:flex-start;gap:4px;padding:4px 4px 6px 6px;}
  .wk-cell input[type=checkbox]{width:14px;height:14px;margin-top:4px;accent-color:var(--green);cursor:pointer;flex:none;}
  .wk-input{flex:1;width:100%;border:none;background:transparent;resize:none;min-height:28px;font-family:'Inter',sans-serif;font-size:12px;color:var(--ink);padding:2px 4px;line-height:1.3;outline:none;}
  .wk-input:focus{background:var(--blue-soft);}
  .wk-cell.done{background:var(--green-soft);}
  .wk-cell.done .wk-input{color:var(--ink-mute);text-decoration:line-through;}

  .status{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-mute);text-align:right;margin-top:10px;min-height:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <p class="title">Hour planner</p>
      <p class="sub" id="rangeLabel">6:00 – 23:00 · offline</p>
    </div>
    <div class="tabs">
      <button class="tab active" id="tabDay">Day</button>
      <button class="tab" id="tabWeek">Week</button>
    </div>
  </div>

  <div class="nav">
    <button id="prevBtn">&#8592;</button>
    <span class="label" id="navLabel"></span>
    <button id="nextBtn">&#8594;</button>
    <button class="today-btn" id="todayBtn">Today</button>
  </div>

  <div id="dayView"></div>
  <div id="weekView" style="display:none;"></div>
  <div class="status" id="statusLine"></div>
</div>

<script>
const START_HOUR = 6, END_HOUR = 23;
let mode = 'day';
let currentDate = new Date();
let store = {};

function pad(n){return n<10?'0'+n:''+n;}
function dateKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmtHour(h){const period=h<12?'am':'pm';let hh=h%12; if(hh===0)hh=12; return hh+':00 '+period;}
function startOfWeek(d){const nd=new Date(d);const day=(nd.getDay()+6)%7;nd.setDate(nd.getDate()-day);nd.setHours(0,0,0,0);return nd;}
function isSameDate(a,b){return dateKey(a)===dateKey(b);}

function loadLocal(){
  try{ store = JSON.parse(localStorage.getItem('hourPlannerData') || '{}'); }
  catch(e){ store = {}; }
}
function saveLocal(){
  localStorage.setItem('hourPlannerData', JSON.stringify(store));
  setStatus('saved');
}
let statusTimer;
function setStatus(msg){
  const el = document.getElementById('statusLine');
  el.textContent = msg;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(()=>{el.textContent='';}, 1200);
}

// entry shape: { text: string, done: bool }
function getEntry(key, h){
  return (store[key] && store[key][h]) || { text:'', done:false };
}
function setEntry(key, h, entry){
  if(!store[key]) store[key] = {};
  if(!entry.text){ delete store[key][h]; }
  else { store[key][h] = entry; }
  saveLocal();
}

function autoGrow(ta){
  ta.style.height = 'auto';
  ta.style.height = Math.max(44, ta.scrollHeight)+'px';
}

function renderDay(){
  const el = document.getElementById('dayView');
  const key = dateKey(currentDate);
  const today = new Date();
  const isToday = isSameDate(currentDate, today);
  const nowHour = today.getHours() + today.getMinutes()/60;

  let html = '<div class="day-grid" id="dayGrid">';
  for(let h=START_HOUR; h<=END_HOUR; h++){
    const entry = getEntry(key, h);
    const isCurrent = isToday && Math.floor(nowHour)===h;
    html += '<div class="hour-row'+(isCurrent?' current-hour':'')+(entry.done?' done':'')+'" data-h="'+h+'">';
    html += '<div class="hour-tick">'+fmtHour(h)+'</div>';
    html += '<div class="check-cell"><input type="checkbox" data-h="'+h+'" '+(entry.done?'checked':'')+'></div>';
    html += '<div class="hour-task"><textarea data-h="'+h+'" placeholder="add a task">'+entry.text+'</textarea></div>';
    html += '</div>';
  }
  html += '</div>';
  el.innerHTML = html;

  if(isToday && nowHour>=START_HOUR && nowHour<=END_HOUR+1){
    const rowH = el.querySelector('.hour-row').offsetHeight;
    const offset = (nowHour-START_HOUR)*rowH;
    const line = document.createElement('div');
    line.className = 'now-line';
    line.style.top = offset+'px';
    document.getElementById('dayGrid').appendChild(line);
  }

  el.querySelectorAll('textarea').forEach(ta=>{
    autoGrow(ta);
    ta.addEventListener('input', ()=>{
      autoGrow(ta);
      const h = ta.dataset.h;
      const entry = getEntry(key, h);
      entry.text = ta.value;
      setEntry(key, h, entry);
    });
  });
  el.querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const h = cb.dataset.h;
      const entry = getEntry(key, h);
      entry.done = cb.checked;
      setEntry(key, h, entry);
      cb.closest('.hour-row').classList.toggle('done', cb.checked);
    });
  });
}

function renderWeek(){
  const el = document.getElementById('weekView');
  const monday = startOfWeek(currentDate);
  const days = [];
  for(let i=0;i<7;i++){ const d=new Date(monday); d.setDate(d.getDate()+i); days.push(d); }
  const keys = days.map(dateKey);
  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const today = new Date();

  let html = '<table class="week"><thead><tr><th></th>';
  days.forEach((d,i)=>{
    const isToday = isSameDate(d, today);
    html += '<th class="'+(isToday?'today-col':'')+'">'+dayNames[i]+'<span class="dnum">'+(d.getMonth()+1)+'/'+d.getDate()+'</span></th>';
  });
  html += '</tr></thead><tbody>';

  for(let h=START_HOUR; h<=END_HOUR; h++){
    html += '<tr><td class="wk-hour">'+fmtHour(h)+'</td>';
    days.forEach((d,i)=>{
      const entry = getEntry(keys[i], h);
      html += '<td><div class="wk-cell'+(entry.done?' done':'')+'" data-key="'+keys[i]+'" data-h="'+h+'">'+
        '<input type="checkbox" '+(entry.done?'checked':'')+'>' +
        '<textarea class="wk-input">'+entry.text+'</textarea></div></td>';
    });
    html += '</tr>';
  }
  html += '</tbody></table>';
  el.innerHTML = html;

  el.querySelectorAll('.wk-cell').forEach(cell=>{
    const key = cell.dataset.key, h = cell.dataset.h;
    const ta = cell.querySelector('textarea');
    const cb = cell.querySelector('input[type=checkbox]');
    ta.addEventListener('input', ()=>{
      const entry = getEntry(key, h);
      entry.text = ta.value;
      setEntry(key, h, entry);
    });
    cb.addEventListener('change', ()=>{
      const entry = getEntry(key, h);
      entry.done = cb.checked;
      setEntry(key, h, entry);
      cell.classList.toggle('done', cb.checked);
    });
  });
}

function updateNavLabel(){
  const label = document.getElementById('navLabel');
  if(mode==='day'){
    label.textContent = currentDate.toLocaleDateString(undefined,{weekday:'long', month:'short', day:'numeric'});
  } else {
    const monday = startOfWeek(currentDate);
    const sunday = new Date(monday); sunday.setDate(sunday.getDate()+6);
    label.textContent = monday.toLocaleDateString(undefined,{month:'short',day:'numeric'}) + ' – ' + sunday.toLocaleDateString(undefined,{month:'short',day:'numeric'});
  }
}

function render(){
  updateNavLabel();
  if(mode==='day'){
    document.getElementById('dayView').style.display='';
    document.getElementById('weekView').style.display='none';
    renderDay();
  } else {
    document.getElementById('dayView').style.display='none';
    document.getElementById('weekView').style.display='';
    renderWeek();
  }
}

document.getElementById('tabDay').addEventListener('click', ()=>{
  mode='day'; document.getElementById('tabDay').classList.add('active'); document.getElementById('tabWeek').classList.remove('active'); render();
});
document.getElementById('tabWeek').addEventListener('click', ()=>{
  mode='week'; document.getElementById('tabWeek').classList.add('active'); document.getElementById('tabDay').classList.remove('active'); render();
});
document.getElementById('prevBtn').addEventListener('click', ()=>{
  currentDate.setDate(currentDate.getDate() - (mode==='day'?1:7)); render();
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  currentDate.setDate(currentDate.getDate() + (mode==='day'?1:7)); render();
});
document.getElementById('todayBtn').addEventListener('click', ()=>{
  currentDate = new Date(); render();
});

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('service-worker.js').catch(()=>{}));
}

loadLocal();
render();
</script>
</body>
</html>
